# -*- coding: utf-8 -*-
"""
Pilot SFT Clean v3: pure SFT, inputv2 format, no rule/KD/DPO.
DATA_DIR: /path/to/mini_42_pilot    # ← set to your TCM-SD-42 data directory
OUTPUT:   /path/to/output          # ← set to your output directory
GROUP:    pilot_sft_clean_v3

Goal: clean format training; formal evaluation extracts one closed-set syndrome label.
Treatment/formula fields are not part of the reported label-level metrics.
"""
import sys
from pathlib import Path
import os
sys.path.insert(0, str(Path(__file__).parent.parent))
from config import *

MAX_SEQ_LENGTH = 768

# ── Pilot data (user-configurable via env var) ─────────────────
